version: '3.8'\n\nservices:\n  app:\n    build: .\n    ports:\n      - \"3000:3000\"\n    environment:\n      - NODE_ENV=development\n      - MONGODB_URI=mongodb://mongo:27017/github-ai-app\n      - PORT=3000\n    depends_on:\n      - mongo\n    volumes:\n      - ./src:/app/src\n    restart: unless-stopped\n\n  mongo:\n    image: mongo:7.0-alpine\n    ports:\n      - \"27017:27017\"\n    volumes:\n      - mongo_data:/data/db\n    restart: unless-stopped\n\nvolumes:\n  mongo_data:\n