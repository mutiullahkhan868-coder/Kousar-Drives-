<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Digital Clock - Multiple Time Zones</title>\n    <style>\n        * {\n            margin: 0;\n            padding: 0;\n            box-sizing: border-box;\n        }\n\n        body {\n            font-family: 'Courier New', monospace;\n            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n            min-height: 100vh;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            padding: 20px;\n        }\n\n        .container {\n            background: rgba(255, 255, 255, 0.1);\n            backdrop-filter: blur(10px);\n            border-radius: 20px;\n            padding: 40px;\n            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);\n            border: 1px solid rgba(255, 255, 255, 0.18);\n            max-width: 1200px;\n            width: 100%;\n        }\n\n        h1 {\n            text-align: center;\n            color: white;\n            margin-bottom: 40px;\n            font-size: 2.5em;\n            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);\n        }\n\n        .clocks-grid {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));\n            gap: 30px;\n        }\n\n        .clock-card {\n            background: rgba(255, 255, 255, 0.15);\n            border-radius: 15px;\n            padding: 25px;\n            text-align: center;\n            backdrop-filter: blur(5px);\n            border: 1px solid rgba(255, 255, 255, 0.2);\n            transition: transform 0.3s ease, box-shadow 0.3s ease;\n            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);\n        }\n\n        .clock-card:hover {\n            transform: translateY(-5px);\n            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);\n        }\n\n        .timezone-name {\n            font-size: 1.3em;\n            color: #fff;\n            margin-bottom: 15px;\n            font-weight: bold;\n            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);\n        }\n\n        .city-name {\n            font-size: 0.9em;\n            color: rgba(255, 255, 255, 0.8);\n            margin-bottom: 15px;\n        }\n\n        .digital-time {\n            font-size: 2.5em;\n            font-weight: bold;\n            color: #4ade80;\n            margin-bottom: 10px;\n            font-family: 'Courier New', monospace;\n            letter-spacing: 2px;\n            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);\n        }\n\n        .time-format {\n            font-size: 0.9em;\n            color: rgba(255, 255, 255, 0.7);\n            margin-bottom: 15px;\n        }\n\n        .analog-clock {\n            width: 200px;\n            height: 200px;\n            margin: 20px auto;\n            background: rgba(255, 255, 255, 0.1);\n            border-radius: 50%;\n            border: 3px solid rgba(255, 255, 255, 0.3);\n            position: relative;\n            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);\n        }\n\n        .center-dot {\n            width: 12px;\n            height: 12px;\n            background: white;\n            border-radius: 50%;\n            position: absolute;\n            top: 50%;\n            left: 50%;\n            transform: translate(-50%, -50%);\n            z-index: 10;\n        }\n\n        .hand {\n            position: absolute;\n            bottom: 50%;\n            left: 50%;\n            transform-origin: bottom center;\n            background: white;\n            border-radius: 10px;\n        }\n\n        .hour-hand {\n            width: 6px;\n            height: 60px;\n            margin-left: -3px;\n            background: rgba(255, 255, 255, 0.9);\n        }\n\n        .minute-hand {\n            width: 4px;\n            height: 80px;\n            margin-left: -2px;\n            background: rgba(255, 255, 255, 0.7);\n        }\n\n        .second-hand {\n            width: 2px;\n            height: 90px;\n            margin-left: -1px;\n            background: #4ade80;\n        }\n\n        .clock-numbers {\n            position: absolute;\n            width: 100%;\n            height: 100%;\n            top: 0;\n            left: 0;\n        }\n\n        .clock-number {\n            position: absolute;\n            width: 100%;\n            height: 100%;\n            text-align: center;\n            color: white;\n            font-size: 1.1em;\n            font-weight: bold;\n        }\n\n        .clock-number span {\n            display: inline-block;\n            position: absolute;\n            left: 50%;\n            transform: translateX(-50%);\n        }\n\n        .offset {\n            font-size: 0.85em;\n            color: rgba(255, 255, 255, 0.6);\n            margin-top: 10px;\n        }\n\n        .controls {\n            text-align: center;\n            margin-top: 30px;\n        }\n\n        button {\n            background: rgba(255, 255, 255, 0.2);\n            border: 2px solid white;\n            color: white;\n            padding: 10px 20px;\n            border-radius: 8px;\n            cursor: pointer;\n            font-size: 1em;\n            transition: all 0.3s ease;\n            margin: 0 10px;\n        }\n\n        button:hover {\n            background: rgba(255, 255, 255, 0.3);\n            transform: scale(1.05);\n        }\n\n        button:active {\n            transform: scale(0.95);\n        }\n\n        .format-toggle {\n            display: flex;\n            justify-content: center;\n            gap: 20px;\n            margin-bottom: 30px;\n        }\n\n        .format-btn {\n            background: rgba(255, 255, 255, 0.15);\n            border: 2px solid rgba(255, 255, 255, 0.3);\n            color: white;\n            padding: 8px 16px;\n            border-radius: 6px;\n            cursor: pointer;\n            font-size: 0.95em;\n            transition: all 0.3s ease;\n        }\n\n        .format-btn.active {\n            background: rgba(74, 222, 128, 0.3);\n            border-color: rgba(74, 222, 128, 0.8);\n            color: #4ade80;\n        }\n\n        .format-btn:hover {\n            background: rgba(255, 255, 255, 0.25);\n        }\n\n        @media (max-width: 768px) {\n            .container {\n                padding: 20px;\n            }\n\n            h1 {\n                font-size: 1.8em;\n            }\n\n            .clocks-grid {\n                grid-template-columns: 1fr;\n            }\n\n            .digital-time {\n                font-size: 2em;\n            }\n        }\n    </style>\n</head>\n<body>\n    <div class=\"container\">\n        <h1>🌍 Digital Clock</h1>\n        \n        <div class=\"format-toggle\">\n            <button class=\"format-btn active\" id=\"format24\">24-Hour</button>\n            <button class=\"format-btn\" id=\"format12\">12-Hour</button>\n        </div>\n\n        <div class=\"clocks-grid\" id=\"clocksGrid\"></div>\n\n        <div class=\"controls\">\n            <button id=\"addClock\">+ Add Time Zone</button>\n            <button id=\"resetClocks\">Reset to Default</button>\n        </div>\n    </div>\n\n    <script>\n        const timezones = [\n            { name: 'New York', city: 'USA (Eastern)', offset: 'UTC-5', tz: 'America/New_York' },\n            { name: 'London', city: 'United Kingdom', offset: 'UTC+0', tz: 'Europe/London' },\n            { name: 'Paris', city: 'France', offset: 'UTC+1', tz: 'Europe/Paris' },\n            { name: 'Dubai', city: 'United Arab Emirates', offset: 'UTC+4', tz: 'Asia/Dubai' },\n            { name: 'Tokyo', city: 'Japan', offset: 'UTC+9', tz: 'Asia/Tokyo' },\n            { name: 'Sydney', city: 'Australia', offset: 'UTC+10', tz: 'Australia/Sydney' },\n        ];\n\n        let use24Hour = true;\n        let selectedTimezones = timezones.slice();\n\n        function formatTime(date, use24 = true) {\n            const hours = String(date.getHours()).padStart(2, '0');\n            const minutes = String(date.getMinutes()).padStart(2, '0');\n            const seconds = String(date.getSeconds()).padStart(2, '0');\n\n            if (use24) {\n                return `${hours}:${minutes}:${seconds}`;\n            } else {\n                const hour12 = date.getHours() % 12 || 12;\n                const period = date.getHours() >= 12 ? 'PM' : 'AM';\n                return `${String(hour12).padStart(2, '0')}:${minutes}:${seconds} ${period}`;\n            }\n        }\n\n        function getTimeInTimezone(tz) {\n            return new Date(new Date().toLocaleString('en-US', { timeZone: tz }));\n        }\n\n        function createClockCard(timezone) {\n            const card = document.createElement('div');\n            card.className = 'clock-card';\n            card.innerHTML = `\n                <div class=\"timezone-name\">${timezone.name}</div>\n                <div class=\"city-name\">${timezone.city}</div>\n                <div class=\"digital-time\" data-tz=\"${timezone.tz}\"></div>\n                <div class=\"time-format\">24-Hour Format</div>\n                <div class=\"analog-clock\">\n                    <div class=\"clock-numbers\" id=\"numbers-${timezone.tz}\"></div>\n                    <div class=\"hand hour-hand\" data-tz=\"${timezone.tz}\"></div>\n                    <div class=\"hand minute-hand\" data-tz=\"${timezone.tz}\"></div>\n                    <div class=\"hand second-hand\" data-tz=\"${timezone.tz}\"></div>\n                    <div class=\"center-dot\"></div>\n                </div>\n                <div class=\"offset\">${timezone.offset}</div>\n            `;\n            return card;\n        }\n\n        function updateClocks() {\n            selectedTimezones.forEach(timezone => {\n                const time = getTimeInTimezone(timezone.tz);\n                const timeDisplay = document.querySelector(`[data-tz=\"${timezone.tz}\"]`);\n                \n                if (timeDisplay) {\n                    timeDisplay.textContent = formatTime(time, use24Hour);\n                }\n\n                // Update analog clock\n                const hours = time.getHours();\n                const minutes = time.getMinutes();\n                const seconds = time.getSeconds();\n\n                const hourHand = document.querySelector(`.hour-hand[data-tz=\"${timezone.tz}\"]`);\n                const minuteHand = document.querySelector(`.minute-hand[data-tz=\"${timezone.tz}\"]`);\n                const secondHand = document.querySelector(`.second-hand[data-tz=\"${timezone.tz}\"]`);\n\n                if (hourHand) {\n                    const hourDeg = (hours % 12) * 30 + minutes * 0.5;\n                    hourHand.style.transform = `rotate(${hourDeg}deg)`;\n                }\n\n                if (minuteHand) {\n                    const minuteDeg = minutes * 6 + seconds * 0.1;\n                    minuteHand.style.transform = `rotate(${minuteDeg}deg)`;\n                }\n\n                if (secondHand) {\n                    const secondDeg = seconds * 6;\n                    secondHand.style.transform = `rotate(${secondDeg}deg)`;\n                }\n            });\n        }\n\n        function renderClocks() {\n            const grid = document.getElementById('clocksGrid');\n            grid.innerHTML = '';\n            selectedTimezones.forEach(tz => {\n                grid.appendChild(createClockCard(tz));\n            });\n            updateClocks();\n        }\n\n        function initClockNumbers() {\n            setTimeout(() => {\n                selectedTimezones.forEach(timezone => {\n                    const numbersContainer = document.getElementById(`numbers-${timezone.tz}`);\n                    if (numbersContainer && numbersContainer.children.length === 0) {\n                        for (let i = 1; i <= 12; i++) {\n                            const angle = (i * 30 - 90) * (Math.PI / 180);\n                            const x = 100 + 85 * Math.cos(angle);\n                            const y = 100 + 85 * Math.sin(angle);\n                            const num = document.createElement('div');\n                            num.className = 'clock-number';\n                            num.style.transform = `translate(${x}px, ${y}px)`;\n                            num.innerHTML = `<span>${i}</span>`;\n                            numbersContainer.appendChild(num);\n                        }\n                    }\n                });\n            }, 0);\n        }\n\n        // Event Listeners\n        document.getElementById('format24').addEventListener('click', function() {\n            use24Hour = true;\n            document.querySelectorAll('.time-format').forEach(el => el.textContent = '24-Hour Format');\n            document.getElementById('format24').classList.add('active');\n            document.getElementById('format12').classList.remove('active');\n            updateClocks();\n        });\n\n        document.getElementById('format12').addEventListener('click', function() {\n            use24Hour = false;\n            document.querySelectorAll('.time-format').forEach(el => el.textContent = '12-Hour Format');\n            document.getElementById('format12').classList.add('active');\n            document.getElementById('format24').classList.remove('active');\n            updateClocks();\n        });\n\n        document.getElementById('addClock').addEventListener('click', function() {\n            const unused = timezones.filter(tz => !selectedTimezones.find(s => s.tz === tz.tz));\n            if (unused.length > 0) {\n                selectedTimezones.push(unused[Math.floor(Math.random() * unused.length)]);\n                renderClocks();\n                initClockNumbers();\n            } else {\n                alert('All available time zones are already displayed!');\n            }\n        });\n\n        document.getElementById('resetClocks').addEventListener('click', function() {\n            selectedTimezones = timezones.slice();\n            renderClocks();\n            initClockNumbers();\n        });\n\n        // Initial render\n        renderClocks();\n        initClockNumbers();\n\n        // Update every second\n        setInterval(updateClocks, 1000);\n    </script>\n</body>\n</html>\n
