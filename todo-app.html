<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>To-Do List App</title>\n    <style>\n        * {\n            margin: 0;\n            padding: 0;\n            box-sizing: border-box;\n        }\n\n        body {\n            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n            min-height: 100vh;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            padding: 20px;\n        }\n\n        .container {\n            background: white;\n            border-radius: 20px;\n            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);\n            width: 100%;\n            max-width: 500px;\n            padding: 40px;\n        }\n\n        h1 {\n            color: #333;\n            margin-bottom: 30px;\n            text-align: center;\n            font-size: 2.5em;\n        }\n\n        .input-container {\n            display: flex;\n            gap: 10px;\n            margin-bottom: 30px;\n        }\n\n        #taskInput {\n            flex: 1;\n            padding: 12px 15px;\n            border: 2px solid #e0e0e0;\n            border-radius: 10px;\n            font-size: 1em;\n            transition: border-color 0.3s ease;\n        }\n\n        #taskInput:focus {\n            outline: none;\n            border-color: #667eea;\n        }\n\n        #taskInput::placeholder {\n            color: #999;\n        }\n\n        .btn {\n            padding: 12px 25px;\n            border: none;\n            border-radius: 10px;\n            font-size: 1em;\n            cursor: pointer;\n            transition: all 0.3s ease;\n            font-weight: 600;\n        }\n\n        #addBtn {\n            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n            color: white;\n        }\n\n        #addBtn:hover {\n            transform: translateY(-2px);\n            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);\n        }\n\n        #addBtn:active {\n            transform: translateY(0);\n        }\n\n        .filter-buttons {\n            display: flex;\n            gap: 10px;\n            margin-bottom: 20px;\n            flex-wrap: wrap;\n        }\n\n        .filter-btn {\n            padding: 8px 15px;\n            border: 2px solid #e0e0e0;\n            background: white;\n            border-radius: 8px;\n            cursor: pointer;\n            font-weight: 600;\n            transition: all 0.3s ease;\n            color: #666;\n        }\n\n        .filter-btn.active {\n            background: #667eea;\n            color: white;\n            border-color: #667eea;\n        }\n\n        .filter-btn:hover {\n            border-color: #667eea;\n        }\n\n        .stats {\n            display: grid;\n            grid-template-columns: repeat(3, 1fr);\n            gap: 10px;\n            margin-bottom: 20px;\n            padding: 15px;\n            background: #f5f5f5;\n            border-radius: 10px;\n        }\n\n        .stat-item {\n            text-align: center;\n        }\n\n        .stat-label {\n            font-size: 0.85em;\n            color: #999;\n            margin-bottom: 5px;\n        }\n\n        .stat-value {\n            font-size: 1.5em;\n            font-weight: bold;\n            color: #667eea;\n        }\n\n        #taskList {\n            list-style: none;\n            max-height: 400px;\n            overflow-y: auto;\n        }\n\n        .task-item {\n            background: #f9f9f9;\n            padding: 15px;\n            margin-bottom: 10px;\n            border-radius: 10px;\n            display: flex;\n            align-items: center;\n            gap: 12px;\n            transition: all 0.3s ease;\n            border-left: 4px solid #667eea;\n        }\n\n        .task-item:hover {\n            background: #f0f0f0;\n            transform: translateX(5px);\n        }\n\n        .task-item.completed {\n            border-left-color: #4caf50;\n        }\n\n        .task-item.completed .task-text {\n            text-decoration: line-through;\n            color: #999;\n        }\n\n        .task-item.high-priority {\n            border-left-color: #ff6b6b;\n            background: #fff5f5;\n        }\n\n        .checkbox {\n            width: 20px;\n            height: 20px;\n            cursor: pointer;\n            accent-color: #667eea;\n        }\n\n        .task-content {\n            flex: 1;\n        }\n\n        .task-text {\n            color: #333;\n            font-weight: 500;\n        }\n\n        .task-meta {\n            font-size: 0.8em;\n            color: #999;\n            margin-top: 5px;\n        }\n\n        .task-priority {\n            padding: 3px 8px;\n            border-radius: 5px;\n            font-size: 0.75em;\n            font-weight: 600;\n            text-transform: uppercase;\n        }\n\n        .priority-high {\n            background: #ffebee;\n            color: #d32f2f;\n        }\n\n        .priority-medium {\n            background: #fff3e0;\n            color: #f57c00;\n        }\n\n        .priority-low {\n            background: #e8f5e9;\n            color: #388e3c;\n        }\n\n        .task-actions {\n            display: flex;\n            gap: 8px;\n        }\n\n        .task-btn {\n            background: none;\n            border: none;\n            cursor: pointer;\n            font-size: 1.2em;\n            transition: all 0.3s ease;\n            padding: 5px 8px;\n            border-radius: 5px;\n        }\n\n        .delete-btn:hover {\n            background: #ffebee;\n            color: #d32f2f;\n        }\n\n        .edit-btn:hover {\n            background: #e3f2fd;\n            color: #1976d2;\n        }\n\n        .empty-state {\n            text-align: center;\n            padding: 40px 20px;\n            color: #999;\n        }\n\n        .empty-state svg {\n            width: 80px;\n            height: 80px;\n            margin-bottom: 20px;\n            opacity: 0.3;\n        }\n\n        .empty-state p {\n            font-size: 1.1em;\n        }\n\n        .controls {\n            display: flex;\n            gap: 10px;\n            margin-top: 20px;\n        }\n\n        .clear-btn {\n            flex: 1;\n            background: #f44336;\n            color: white;\n            padding: 10px;\n            border: none;\n            border-radius: 8px;\n            cursor: pointer;\n            font-weight: 600;\n            transition: all 0.3s ease;\n        }\n\n        .clear-btn:hover {\n            background: #d32f2f;\n        }\n\n        .export-btn {\n            flex: 1;\n            background: #4caf50;\n            color: white;\n            padding: 10px;\n            border: none;\n            border-radius: 8px;\n            cursor: pointer;\n            font-weight: 600;\n            transition: all 0.3s ease;\n        }\n\n        .export-btn:hover {\n            background: #388e3c;\n        }\n\n        @media (max-width: 600px) {\n            .container {\n                padding: 20px;\n            }\n\n            h1 {\n                font-size: 1.8em;\n            }\n\n            .filter-buttons {\n                flex-direction: column;\n            }\n\n            .filter-btn {\n                width: 100%;\n            }\n        }\n    </style>\n</head>\n<body>\n    <div class=\"container\">\n        <h1>📋 My Tasks</h1>\n\n        <div class=\"input-container\">\n            <input\n                type=\"text\"\n                id=\"taskInput\"\n                placeholder=\"Add a new task...\"\n            />\n            <button id=\"addBtn\" class=\"btn\">Add</button>\n        </div>\n\n        <div class=\"filter-buttons\">\n            <button class=\"filter-btn active\" data-filter=\"all\">All</button>\n            <button class=\"filter-btn\" data-filter=\"active\">Active</button>\n            <button class=\"filter-btn\" data-filter=\"completed\">Completed</button>\n            <button class=\"filter-btn\" data-filter=\"high\">High Priority</button>\n        </div>\n\n        <div class=\"stats\">\n            <div class=\"stat-item\">\n                <div class=\"stat-label\">Total</div>\n                <div class=\"stat-value\" id=\"totalCount\">0</div>\n            </div>\n            <div class=\"stat-item\">\n                <div class=\"stat-label\">Completed</div>\n                <div class=\"stat-value\" id=\"completedCount\">0</div>\n            </div>\n            <div class=\"stat-item\">\n                <div class=\"stat-label\">Remaining</div>\n                <div class=\"stat-value\" id=\"remainingCount\">0</div>\n            </div>\n        </div>\n\n        <ul id=\"taskList\"></ul>\n\n        <div class=\"controls\">\n            <button class=\"clear-btn\" id=\"clearBtn\">Clear Completed</button>\n            <button class=\"export-btn\" id=\"exportBtn\">Export Tasks</button>\n        </div>\n    </div>\n\n    <script>\n        // To-Do List Application with Local Storage\n        class TodoApp {\n            constructor() {\n                this.tasks = this.loadTasks();\n                this.currentFilter = 'all';\n                this.init();\n            }\n\n            init() {\n                this.cacheElements();\n                this.bindEvents();\n                this.render();\n            }\n\n            cacheElements() {\n                this.taskInput = document.getElementById('taskInput');\n                this.addBtn = document.getElementById('addBtn');\n                this.taskList = document.getElementById('taskList');\n                this.filterBtns = document.querySelectorAll('.filter-btn');\n                this.clearBtn = document.getElementById('clearBtn');\n                this.exportBtn = document.getElementById('exportBtn');\n            }\n\n            bindEvents() {\n                this.addBtn.addEventListener('click', () => this.addTask());\n                this.taskInput.addEventListener('keypress', (e) => {\n                    if (e.key === 'Enter') this.addTask();\n                });\n                this.filterBtns.forEach(btn => {\n                    btn.addEventListener('click', (e) => this.setFilter(e.target));\n                });\n                this.clearBtn.addEventListener('click', () => this.clearCompleted());\n                this.exportBtn.addEventListener('click', () => this.exportTasks());\n            }\n\n            addTask() {\n                const text = this.taskInput.value.trim();\n                if (!text) return;\n\n                const task = {\n                    id: Date.now(),\n                    text,\n                    completed: false,\n                    priority: 'medium',\n                    createdAt: new Date().toLocaleString(),\n                };\n\n                this.tasks.unshift(task);\n                this.saveTasks();\n                this.taskInput.value = '';\n                this.taskInput.focus();\n                this.render();\n            }\n\n            deleteTask(id) {\n                this.tasks = this.tasks.filter(task => task.id !== id);\n                this.saveTasks();\n                this.render();\n            }\n\n            toggleComplete(id) {\n                const task = this.tasks.find(t => t.id === id);\n                if (task) {\n                    task.completed = !task.completed;\n                    this.saveTasks();\n                    this.render();\n                }\n            }\n\n            updatePriority(id, priority) {\n                const task = this.tasks.find(t => t.id === id);\n                if (task) {\n                    task.priority = priority;\n                    this.saveTasks();\n                    this.render();\n                }\n            }\n\n            setFilter(btn) {\n                this.filterBtns.forEach(b => b.classList.remove('active'));\n                btn.classList.add('active');\n                this.currentFilter = btn.dataset.filter;\n                this.render();\n            }\n\n            getFilteredTasks() {\n                switch (this.currentFilter) {\n                    case 'active':\n                        return this.tasks.filter(t => !t.completed);\n                    case 'completed':\n                        return this.tasks.filter(t => t.completed);\n                    case 'high':\n                        return this.tasks.filter(t => t.priority === 'high');\n                    default:\n                        return this.tasks;\n                }\n            }\n\n            clearCompleted() {\n                if (confirm('Delete all completed tasks?')) {\n                    this.tasks = this.tasks.filter(t => !t.completed);\n                    this.saveTasks();\n                    this.render();\n                }\n            }\n\n            exportTasks() {\n                const dataStr = JSON.stringify(this.tasks, null, 2);\n                const dataBlob = new Blob([dataStr], { type: 'application/json' });\n                const url = URL.createObjectURL(dataBlob);\n                const link = document.createElement('a');\n                link.href = url;\n                link.download = `tasks-${new Date().toISOString().split('T')[0]}.json`;\n                link.click();\n                URL.revokeObjectURL(url);\n            }\n\n            updateStats() {\n                const total = this.tasks.length;\n                const completed = this.tasks.filter(t => t.completed).length;\n                const remaining = total - completed;\n\n                document.getElementById('totalCount').textContent = total;\n                document.getElementById('completedCount').textContent = completed;\n                document.getElementById('remainingCount').textContent = remaining;\n            }\n\n            render() {\n                const filtered = this.getFilteredTasks();\n\n                if (filtered.length === 0) {\n                    this.taskList.innerHTML = `\n                        <div class=\"empty-state\">\n                            <p>✨ No tasks found. Add one to get started!</p>\n                        </div>\n                    `;\n                } else {\n                    this.taskList.innerHTML = filtered\n                        .map(task => this.createTaskElement(task))\n                        .join('');\n\n                    this.taskList.querySelectorAll('.checkbox').forEach(checkbox => {\n                        checkbox.addEventListener('change', (e) => {\n                            this.toggleComplete(parseInt(e.target.dataset.id));\n                        });\n                    });\n\n                    this.taskList.querySelectorAll('.delete-btn').forEach(btn => {\n                        btn.addEventListener('click', (e) => {\n                            this.deleteTask(parseInt(e.target.dataset.id));\n                        });\n                    });\n\n                    this.taskList.querySelectorAll('.priority-select').forEach(select => {\n                        select.addEventListener('change', (e) => {\n                            this.updatePriority(parseInt(e.target.dataset.id), e.target.value);\n                        });\n                    });\n                }\n\n                this.updateStats();\n            }\n\n            createTaskElement(task) {\n                return `\n                    <li class=\"task-item ${task.completed ? 'completed' : ''} ${task.priority === 'high' ? 'high-priority' : ''}\">\n                        <input\n                            type=\"checkbox\"\n                            class=\"checkbox\"\n                            data-id=\"${task.id}\"\n                            ${task.completed ? 'checked' : ''}\n                        />\n                        <div class=\"task-content\">\n                            <div class=\"task-text\">${this.escapeHtml(task.text)}</div>\n                            <div class=\"task-meta\">\n                                ${task.createdAt}\n                            </div>\n                        </div>\n                        <select class=\"priority-select\" data-id=\"${task.id}\">\n                            <option value=\"low\" ${task.priority === 'low' ? 'selected' : ''}>Low</option>\n                            <option value=\"medium\" ${task.priority === 'medium' ? 'selected' : ''}>Medium</option>\n                            <option value=\"high\" ${task.priority === 'high' ? 'selected' : ''}>High</option>\n                        </select>\n                        <button class=\"task-btn delete-btn\" data-id=\"${task.id}\" title=\"Delete\">🗑️</button>\n                    </li>\n                `;\n            }\n\n            escapeHtml(text) {\n                const map = {\n                    '&': '&amp;',\n                    '<': '&lt;',\n                    '>': '&gt;',\n                    '\"': '&quot;',\n                    \"'\": '&#039;',\n                };\n                return text.replace(/[&<>\"']/g, m => map[m]);\n            }\n\n            saveTasks() {\n                localStorage.setItem('tasks', JSON.stringify(this.tasks));\n            }\n\n            loadTasks() {\n                const tasks = localStorage.getItem('tasks');\n                return tasks ? JSON.parse(tasks) : [];\n            }\n        }\n\n        // Initialize app\n        const app = new TodoApp();\n    </script>\n</body>\n</html>\n
